<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='menu_cliente.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/menu_cliente" class="nav-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo BookNest Coffee">

            <ul>
                <li><a href="/libros_cliente">Buscar libros</a></li>

    <main>

    </div>
    <div class="hero-wrap">
        <img src="{{ url_for('static', filename='imagen-principal.jpg') }}" alt="Imagen Principal" class="hero-img">
