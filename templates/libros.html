<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest — Catálogo de Libros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='menu_admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='librosAdmin.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/menu_administrador" class="nav-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo BookNest Coffee">
            </a>
            <ul>
                <li><a href="/libros">Libros</a></li>
                <li><a href="/gestion_reservas">Reservas</a></li>
                <li><a href="/productos">Productos</a></li>
                <li><a href="/estadisticas">Ver estadísticas</a></li>
            </ul>
            <a href="/logout" class="cerrar-sesion">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                    <path d="M9 12h12l-3 -3"/>
                    <path d="M18 15l3 -3"/>
                </svg>
                Cerrar sesión
            </a>
        </nav>
    </header>

    <div class="banner-libros">
        <img src="{{ url_for('static', filename='banner.jpg') }}" alt="Banner libros">
    </div>

    <main class="libros-admin-main">

        <!-- Encabezado -->
        <div class="libros-admin-header">
            <h1>Catálogo de libros</h1>
            <div class="header-acciones">
                <a href="/libros_cliente" class="btn-secundario">Ver reseñas de libros</a>
                <button id="mostrar-formulario-agregar" class="btn-primario">Agregar nuevo libro</button>
            </div>
        </div>

        <!-- Formulario agregar -->
        <div id="form-agregar-libro" class="form-card" style="display:none;">
            <h2>Agregar nuevo libro</h2>
            <form method="POST" action="{{ url_for('auth.libros') }}" enctype="multipart/form-data" class="form-grid">
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" required>
                </div>
                <div class="form-group">
                    <label for="autor">Autor</label>
                    <input type="text" name="autor" id="autor" required>
                </div>
                <div class="form-group form-full">
                    <label for="sinopsis">Sinopsis</label>
                    <textarea name="sinopsis" id="sinopsis" rows="3" required></textarea>
                </div>
                <div class="form-group form-full">
                    <label for="imagen">Imagen (jpg, png, gif)</label>
                    <input type="file" name="imagen" id="imagen" accept=".png,.jpg,.jpeg,.gif">
                </div>
                <div class="form-full form-actions">
                    <button class="btn-primario" type="submit">Agregar libro</button>
                </div>
            </form>
        </div>

        <!-- Grid de libros -->
        <div class="libros-grid">
            {% for libro in libros %}
            <div class="libro-card">
                <div class="libro-cover">
                    <img src="{{ url_for('static', filename='uploads/' + libro['imagen']) if libro['imagen'] else 'https://via.placeholder.com/180x240?text=Sin+imagen' }}"
                        alt="{{ libro['titulo'] }}">
                    <div class="libro-acciones">
                        <button class="btn-editar" type="button"
                            data-id="{{ libro['id_libro'] }}"
                            data-titulo="{{ libro['titulo'] }}"
                            data-autor="{{ libro['autor'] }}"
                            data-sinopsis="{{ libro['sinopsis'] }}"
                            data-imagen="{{ libro['imagen'] }}"
                            onclick="openModal(this)">
                            Editar
                        </button>
                        <form method="POST" action="{{ url_for('auth.eliminar_libro', id=libro['id_libro']) }}"
                            onsubmit="return confirm('¿Seguro que quieres eliminar este libro?');">
                            <button type="submit" class="btn-eliminar">Eliminar</button>
                        </form>
                    </div>
                </div>
                <div class="libro-info">
                    <h3>{{ libro['titulo'] }}</h3>
                    <p class="libro-autor">{{ libro['autor'] }}</p>
                    <p class="libro-sinopsis">{{ libro['sinopsis'] }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>

    <!-- Modal editar -->
    <div id="modalEditar" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Editar libro</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <img id="imagen-actual" src="" alt="Imagen actual" class="modal-img-preview">
            <form id="form-editar-libro" method="POST" enctype="multipart/form-data" class="form-grid">
                <input type="hidden" name="id" id="editar-id">
                <div class="form-group">
                    <label for="editar-titulo">Título</label>
                    <input type="text" name="titulo" id="editar-titulo" required>
                </div>
                <div class="form-group">
                    <label for="editar-autor">Autor</label>
                    <input type="text" name="autor" id="editar-autor" required>
                </div>
                <div class="form-group form-full">
                    <label for="editar-sinopsis">Sinopsis</label>
                    <textarea name="sinopsis" id="editar-sinopsis" rows="3" required></textarea>
                </div>
                <div class="form-group form-full">
                    <label for="editar-imagen">Cambiar imagen (opcional)</label>
                    <input type="file" name="imagen" id="editar-imagen" accept=".png,.jpg,.jpeg,.gif">
                </div>
                <div class="form-full form-actions">
                    <button type="submit" class="btn-primario">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    const formEditar = document.getElementById('form-editar-libro');

    function openModal(button) {
        const id_libro = button.getAttribute("data-id");
        const titulo = button.getAttribute("data-titulo");
        const autor = button.getAttribute("data-autor");
        const sinopsis = button.getAttribute("data-sinopsis");
        const imagen = button.getAttribute("data-imagen");

        document.getElementById('editar-id').value = id_libro;
        document.getElementById('editar-titulo').value = titulo;
        document.getElementById('editar-autor').value = autor;
        document.getElementById('editar-sinopsis').value = sinopsis;

        const imgActual = document.getElementById('imagen-actual');
        imgActual.src = imagen ? `/static/uploads/${imagen}` : 'https://via.placeholder.com/150x200?text=Sin+Imagen';

        formEditar.action = `/actualizar_libro/${id_libro}`;
        document.getElementById('modalEditar').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modalEditar').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('modalEditar');
        if (event.target == modal) closeModal();
    }

    document.getElementById('mostrar-formulario-agregar').addEventListener('click', function() {
        const form = document.getElementById('form-agregar-libro');
        const visible = form.style.display !== 'none';
        form.style.display = visible ? 'none' : 'block';
        this.textContent = visible ? 'Agregar nuevo libro' : 'Ocultar formulario';
    });
    </script>
</body>
</html>
