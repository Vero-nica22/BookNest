<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realizar Reserva</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
    <div class="container">
        <div>
            <a href="{{ url_for('auth.menu_cliente') }}">
                <button type="button">← Volver al menú</button>
            </a>
        </div>

        <form class="reserva-form" method="POST"
            action="{{ url_for('reservas.crear_reserva', id_libro=libro['id_libro']) }}">

            <h2>Realizar reserva</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" value="{{ usuario['nombre'] }}" readonly />
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" value="{{ usuario['apellido'] }}" readonly />
                </div>
            </div>

            <div class="form-group">
                <label for="libro">Libro</label>
                <input type="text" id="libro" value="{{ libro['titulo'] }}" readonly />
            </div>

            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" name="fecha" required />
            </div>

            <div class="form-group">
                <label for="hora_inicio">Hora inicio</label>
                <input type="time" id="hora_inicio" name="hora_inicio" required />
            </div>

            <div class="form-group">
                <label for="hora_fin">Hora fin</label>
                <input type="time" id="hora_fin" name="hora_fin" required />
            </div>

            <button type="submit">Reservar</button>
        </form>
    </div>
</body>
</html>
