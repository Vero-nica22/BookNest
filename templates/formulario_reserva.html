<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookNest — Realizar reserva</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='menu_cliente.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='form_reserva.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/menu_cliente" class="nav-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo BookNest Coffee">
            </a>
            <ul>
                <li><a href="/libros_cliente">Buscar libros</a></li>
                <li><a href="/mis_libros">Mis libros</a></li>
                <li><a href="/reservas">Reservas</a></li>
                <li><a href="/ver_productos">Productos</a></li>
            </ul>
            <a href="/logout" class="cerrar-sesion">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                    <path d="M9 12h12l-3 -3"/>
                    <path d="M18 15l3 -3"/>
                </svg>
                Cerrar sesión
            </a>
        </nav>
    </header>

    <main class="formulario-main">
        <div class="formulario-card">
            <div class="formulario-card-header">
                <h1>Realizar reserva</h1>
                <a href="{{ url_for('auth.menu_cliente') }}" class="btn-volver">← Volver al menú</a>
            </div>

            <form method="POST" action="{{ url_for('reservas.crear_reserva', id_libro=libro['id_libro']) }}">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido">
                    </div>
                </div>

                <div class="form-group">
                    <label for="libro">Libro</label>
                    <input type="text" id="libro" name="libro" value="{{ libro['titulo'] }}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="hora_inicio">Hora inicio</label>
                        <input type="time" id="hora_inicio" name="hora_inicio" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="hora_fin">Hora fin</label>
                    <input type="time" id="hora_fin" name="hora_fin" required>
                </div>

                <button type="submit" class="btn-reservar">Confirmar reserva</button>
            </form>
        </div>
    </main>
</body>
</html>
