<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest — Catálogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='indexstyle.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='libros_cliente.css') }}">
</head>
<body>
    <header>
        <nav>
            <a href="/menu_cliente" class="nav-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo BookNest Coffee">
            </a>
            <ul>
                <li><a href="/libros_cliente">Buscar libros</a></li>
                <li><a href="#">Mis libros</a></li>
                <li><a href="/reservas">Reservas</a></li>
                <li><a href="/ver_productos">Productos</a></li>
            </ul>
            <a href="/logout" class="cerrar-sesion">
                <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"/>
                    <path d="M9 12h12l-3 -3"/>
                    <path d="M18 15l3 -3"/>
                </svg>
                Cerrar sesión
            </a>
        </nav>
    </header>

    <main class="catalogo-main">
        <div class="catalogo-header">
            <h1>Catálogo de libros</h1>
        </div>

        <div class="libros-grid">
            {% for libro in libros %}
            <div class="libro-card">
                {% if libro.imagen %}
                    <div class="libro-cover">
                        <img src="{{ url_for('static', filename='uploads/' + libro.imagen) }}" alt="{{ libro.titulo }}">
                    </div>
                {% else %}
                    <div class="libro-cover sin-imagen">
                        <span>Sin portada</span>
                    </div>
                {% endif %}
                <div class="libro-info">
                    <h3>{{ libro.titulo }}</h3>
                    <p class="libro-autor">{{ libro.autor }}</p>
                    <a href="{{ url_for('auth.detalle_libro', id_libro=libro.id_libro) }}" class="btn-detalle">
                        Ver detalles y reseñas
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
